<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวิเคราะห์ข้อมูลเป้าหมาย กก.1 บก.ปพ.</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- vis-network สำหรับ Mind Map -->
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    
    <!-- html2pdf สำหรับส่งออก PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.initFirebase = async () => {
            const appId = 'ssdinvestigation-app';
            
            // ข้อมูลการเชื่อมต่อ Firebase ของคุณ
            const config = {
                apiKey: "AIzaSyCLXW_cr-5VuaQqR3wHNtBtHe5YJ77buno",
                authDomain: "ssdinvestigation.firebaseapp.com",
                projectId: "ssdinvestigation",
                storageBucket: "ssdinvestigation.firebasestorage.app",
                messagingSenderId: "766454429471",
                appId: "1:766454429471:web:c6e0c1dc14f6206b13222a",
                measurementId: "G-6K3X8G7DZ4"
            };

            try {
                const app = initializeApp(config);
                const auth = getAuth(app);
                const db = getFirestore(app);
                
                // ล็อกอินแบบไม่ระบุตัวตนอัตโนมัติ
                await signInAnonymously(auth);

                return { db, auth, appId, collection, addDoc, setDoc, getDoc, getDocs, deleteDoc, doc };
            } catch (error) {
                console.error("Firebase init error:", error);
                return null;
            }
        };
    </script>

    <style>
        body { font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #6b7280; font-weight: 500; hover:text-gray-900; }
        #network-canvas { width: 100%; height: 600px; border: 1px solid #e5e7eb; border-radius: 0.5rem; background-color: #ffffff; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // หมวดหมู่พื้นฐาน 15 หมวด
        const defaultCategories = [
            { id: 1, name: '1. ข้อมูลทะเบียนราษฎร์', fields: ['ชื่อ สกุล ภาษาไทย', 'ชื่อ สกุล ภาษาอังกฤษ', 'เลขบัตรประชาชน', 'ชื่อ สกุล เดิม', 'ชื่อ สกุล บิดา มารดา', 'เลขบัตร ปชช. บิดา มารดา', 'ภูมิลำเนาที่อยู่ปัจจุบัน', 'การเปลี่ยนชื่อ สกุล', 'การเปลี่ยนที่อยู่'] },
            { id: 2, name: '2. ครอบครัว / เครือญาติ', fields: ['บิดา/มารดา/ปู่/ย่า/ตา/ยาย', 'สามี/ภรรยา', 'บุตร/หลาน', 'พี่น้อง/ลูกพี่ลูกน้อง', 'เพื่อนสนิท'] },
            { id: 3, name: '3. สถานที่ทำงาน', fields: ['ประกันสังคม', 'ยังทำงานอยู่', 'ลาออก', 'เพื่อนร่วมงาน', 'เบอร์ติดต่อที่ทำงาน', 'เบอร์โทรศัพท์ส่วนตัว', 'ข้อมูลคนค้ำประกันเข้าทำงาน', 'ที่อยู่ที่ให้ไว้ตอนสมัครงาน'] },
            { id: 4, name: '4. การรักษาพยาบาล', fields: ['สิทธิรักษาพยาบาล', 'โรงพยาบาล', 'ที่ตั้งสถานพยาบาล', 'ข้อมูลญาติที่ติดต่อได้'] },
            { id: 5, name: '5. ทรัพย์สินและอสังหาริมทรัพย์', fields: ['ประเภทที่พักอาศัย', 'บ้าน/คอนโด/อาคารพาณิชย์', 'ตำแหน่งที่ตั้งที่ดิน/ทรัพย์สิน', 'ประเภทที่ดิน', 'ประวัติการซื้อขาย/รับโอน'] },
            { id: 6, name: '6. ข้อมูลยานพาหนะ', fields: ['ยานพาหนะที่เป็นเจ้าของกรรมสิทธิ์', 'ยานพาหนะในครอบครอง', 'ยานพาหนะที่ใช้งานจริง', 'สถานภาพรถปกติ/อายัด', 'วันสิ้นอายุภาษี', 'ตำหนิรูปพรรณพิเศษรถ', 'รายการเปลี่ยนแปลงรถ'] },
            { id: 7, name: '7. ใบอนุญาตขับขี่', fields: ['ประเภทใบอนุญาตขับรถ', 'ที่อยู่ผู้มีใบอนุญาตขับขี่', 'ระบบ GPS (รถรับจ้างสาธารณะ)', 'วันอนุญาต/วันหมดอายุ', 'ชื่อ สกุล (ไทย/อังกฤษ)', 'นายทะเบียน/ที่ออกใบอนุญาต'] },
            { id: 8, name: '8. การเดินทางผ่านจุดสกัด', fields: ['ทะเบียนรถ/ยี่ห้อ/รุ่น/สี', 'ตำแหน่งรถเป้าหมายปัจจุบัน', 'ว/ด/ป ที่ผ่านด่าน-จุดสกัด', 'คำนวณจุดแวะ/พักเป้าหมาย', 'วิเคราะห์เส้นทาง/สถานที่หลบหนี'] },
            { id: 9, name: '9. ข้อมูลโทรศัพท์มือถือ', fields: ['ผู้ให้บริการ AIS/TRUE/DTAC', 'ระบบสัญญาณ', 'หมายเลขโทรศัพท์มือถือ', 'ชื่อผู้จดทะเบียน/ที่อยู่จัดส่งบิล', 'เครือข่ายบุคคลที่ติดต่อด้วย'] },
            { id: 10, name: '10. บริษัทไฟแนนซ์ / สินเชื่อ', fields: ['ที่อยู่ที่ให้ไว้', 'ที่อยู่จัดส่งบิล', 'ชื่อ-ที่อยู่ผู้ค้ำประกัน', 'ประวัติการชำระ', 'แผนที่บ้านผู้เช่าซื้อ/ผู้ค้ำประกัน'] },
            { id: 11, name: '11. การเงิน', fields: ['ชื่อ-สกุล ผู้เปิดบัญชีธนาคาร', 'ข้อมูลฝาก/ถอน/โอน/รับโอน', 'IP Address ที่ทำรายการ', 'คำขอเปิดบัญชี', 'การกดเงินจากตู้ ATM'] },
            { id: 12, name: '12. สื่อสังคมออนไลน์', fields: ['Facebook', 'Instagram', 'X', 'Tiktok', 'Youtube', 'ความสัมพันธ์ในสื่อสังคมออนไลน์', 'รูปภาพที่ถ่าย', 'การเช็คอิน'] },
            { id: 13, name: '13. ข้อมูลการสั่งซื้อสินค้า', fields: ['ผู้ให้บริการจัดส่ง', 'การชำระเงินผ่านบัญชี', 'ที่อยู่จัดส่ง'] },
            { id: 14, name: '14. ข้อมูลการรับ-ส่งพัสดุ', fields: ['ชื่อ-ที่อยู่ ผู้รับ/ผู้ส่ง', 'สถานที่ส่งสินค้า', 'สถานที่รับสินค้า', 'เบอร์โทรที่ให้ไว้กับผู้ส่งพัสดุ'] },
            { id: 15, name: '15. ข้อมูลการขอใช้ไฟฟ้า/ประปา', fields: ['ข้อมูลผู้จดทะเบียนขอใช้ไฟฟ้า/ประปา', 'ที่ตั้งสถานที่ใช้ไฟฟ้า/ประปา', 'ผู้ชำระค่าไฟฟ้า/ประปา', 'ช่องทางการชำระค่าไฟฟ้า/ประปา'] }
        ];

        let mockOnlineDB = [];

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('checklist');
            const [targetInfo, setTargetInfo] = React.useState({ caseNo: '', targetName: '', officerName: '' });
            const [categories, setCategories] = React.useState(defaultCategories);
            const [checklistData, setChecklistData] = React.useState({});
            
            const [isReadOnly, setIsReadOnly] = React.useState(false);
            const [currentCaseId, setCurrentCaseId] = React.useState(null);
            const [allCasesHistory, setAllCasesHistory] = React.useState([]);
            const [searchTerm, setSearchTerm] = React.useState('');

            const [modalInfo, setModalInfo] = React.useState({ isOpen: false, title: '', message: '' });
            const [confirmModal, setConfirmModal] = React.useState({ isOpen: false, title: '', message: '', onConfirm: null });

            const showModal = (title, message) => setModalInfo({ isOpen: true, title, message });
            const closeModal = () => setModalInfo({ isOpen: false, title: '', message: '' });
            
            const showConfirm = (title, message, onConfirm) => {
                setConfirmModal({ isOpen: true, title, message, onConfirm });
            };
            const closeConfirm = () => {
                setConfirmModal({ isOpen: false, title: '', message: '', onConfirm: null });
            };

            const fetchAllHistory = async () => {
                try {
                    const fb = await window.initFirebase();
                    if (fb) {
                        const casesRef = fb.collection(fb.db, 'investigationData', 'cases', 'list');
                        const snapshot = await fb.getDocs(casesRef);
                        let list = [];
                        snapshot.forEach(docSnap => {
                            list.push({ id: docSnap.id, ...docSnap.data() });
                        });
                        setAllCasesHistory(list.sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)));
                    }
                } catch (e) {
                    console.error("Error fetching history", e);
                    showModal('เกิดข้อผิดพลาดในการโหลดข้อมูล', 'โปรดตรวจสอบสิทธิ์ Rules ใน Firestore ว่าเปิดให้ใช้งานแล้วหรือไม่');
                }
            };

            React.useEffect(() => {
                if (activeTab === 'history') {
                    fetchAllHistory();
                }
            }, [activeTab]);

            const handleSaveOnline = async () => {
                if (!targetInfo.caseNo || !targetInfo.targetName) {
                    showModal('แจ้งเตือน', 'กรุณากรอกเลขคดีและชื่อเป้าหมายก่อนบันทึกข้อมูล');
                    return;
                }

                showModal('กำลังดำเนินการ', 'กำลังบันทึกข้อมูลขึ้นระบบออนไลน์...');
                
                const caseData = {
                    targetInfo,
                    categories,
                    checklistData,
                    updatedAt: new Date().toISOString()
                };

                try {
                    const fb = await window.initFirebase();
                    if (fb) {
                        if (currentCaseId) {
                            const docRef = fb.doc(fb.db, 'investigationData', 'cases', 'list', currentCaseId);
                            await fb.setDoc(docRef, caseData, { merge: true });
                        } else {
                            const colRef = fb.collection(fb.db, 'investigationData', 'cases', 'list');
                            const docRef = await fb.addDoc(colRef, caseData);
                            setCurrentCaseId(docRef.id);
                        }
                        showModal('บันทึกสำเร็จ', 'ข้อมูลถูกบันทึกและแชร์เข้าสู่ระบบออนไลน์เรียบร้อยแล้ว ผู้ใช้อื่นสามารถตรวจสอบได้ในหน้าประวัติ');
                    } else {
                        showModal('เกิดข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้');
                    }
                } catch (error) {
                    showModal('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลออนไลน์ได้: ' + error.message);
                }
            };

            const requestDeleteCase = (caseId, targetNameLabel) => {
                showConfirm(
                    '⚠️ ยืนยันการลบข้อมูล',
                    `คุณต้องการลบประวัติของ "${targetNameLabel || 'ไม่ระบุชื่อ'}" ออกจากระบบออนไลน์ถาวร ใช่หรือไม่?\n\n*หมายเหตุ: เมื่อลบแล้ว ผู้ใช้อื่นจะไม่เห็นข้อมูลนี้อีกต่อไป`,
                    async () => {
                        closeConfirm();
                        try {
                            const fb = await window.initFirebase();
                            if (fb) {
                                const docRef = fb.doc(fb.db, 'investigationData', 'cases', 'list', caseId);
                                await fb.deleteDoc(docRef);
                            }
                            
                            if (currentCaseId === caseId) {
                                setCurrentCaseId(null);
                                setTargetInfo({ caseNo: '', targetName: '', officerName: '' });
                                setChecklistData({});
                            }
                            showModal('ลบข้อมูลสำเร็จ', 'ข้อมูลถูกลบออกจากระบบส่วนกลางเรียบร้อยแล้ว');
                            fetchAllHistory();
                        } catch (error) {
                            showModal('เกิดข้อผิดพลาด', 'ไม่สามารถลบข้อมูลได้: ' + error.message);
                        }
                    }
                );
            };

            // ดู Dashboard อย่างเดียว
            const loadCaseForDashboard = (item) => {
                setTargetInfo(item.targetInfo);
                setChecklistData(item.checklistData || {});
                if(item.categories) setCategories(item.categories);
                setCurrentCaseId(item.id);
                setIsReadOnly(true);
                setActiveTab('dashboard');
            };

            // ดู Mind Map อย่างเดียว
            const loadCaseForMindMap = (item) => {
                setTargetInfo(item.targetInfo);
                setChecklistData(item.checklistData || {});
                if(item.categories) setCategories(item.categories);
                setCurrentCaseId(item.id);
                setIsReadOnly(true);
                setActiveTab('mindmap');
            };

            // โหลดข้อมูลเพื่อแก้ไข
            const loadCaseForEdit = (item) => {
                setTargetInfo(item.targetInfo);
                setChecklistData(item.checklistData || {});
                if(item.categories) setCategories(item.categories);
                setCurrentCaseId(item.id);
                setIsReadOnly(false);
                setActiveTab('checklist');
            };

            const handleTargetInfoChange = (e) => {
                setTargetInfo({ ...targetInfo, [e.target.name]: e.target.value });
            };

            const handleChecklistChange = (fieldId, index, value) => {
                const newData = { ...checklistData };
                if (!newData[fieldId]) {
                    newData[fieldId] = [];
                }
                newData[fieldId][index] = value;
                setChecklistData(newData);
            };

            const addFieldItem = (fieldId) => {
                const newData = { ...checklistData };
                if (!newData[fieldId]) {
                    newData[fieldId] = [''];
                }
                newData[fieldId].push('');
                setChecklistData(newData);
            };

            const removeFieldItem = (fieldId, index) => {
                const newData = { ...checklistData };
                newData[fieldId].splice(index, 1);
                if (newData[fieldId].length === 0) {
                    delete newData[fieldId];
                }
                setChecklistData(newData);
            };

            const addNewCustomField = (categoryId) => {
                const fieldName = prompt("กรุณาระบุชื่อข้อมูลที่ต้องการเพิ่ม:");
                if (fieldName && fieldName.trim() !== "") {
                    const newCategories = categories.map(cat => {
                        if (cat.id === categoryId) {
                            return { ...cat, fields: [...cat.fields, fieldName.trim()] };
                        }
                        return cat;
                    });
                    setCategories(newCategories);
                }
            };

            const drawGraph = () => {
                const container = document.getElementById('network-canvas');
                if (!container) return;

                let nodes = [];
                let edges = [];

                nodes.push({
                    id: 'TARGET',
                    label: targetInfo.targetName || 'เป้าหมาย',
                    shape: 'dot',
                    size: 30,
                    color: { background: '#ef4444', border: '#b91c1c' },
                    font: { size: 16, color: '#000000', bold: true },
                    shadow: true
                });

                categories.forEach(cat => {
                    let hasData = false;
                    const catNodeId = `CAT_${cat.id}`;
                    
                    cat.fields.forEach(field => {
                        const fieldValues = checklistData[`${cat.id}_${field}`];
                        if (fieldValues && Array.isArray(fieldValues)) {
                            fieldValues.forEach((val, index) => {
                                if (val && String(val).trim() !== '') {
                                    if (!hasData) {
                                        nodes.push({ id: catNodeId, label: cat.name, shape: 'box', color: '#60a5fa', font: { color: '#ffffff' } });
                                        edges.push({ from: 'TARGET', to: catNodeId, color: '#9ca3af' });
                                        hasData = true;
                                    }
                                    
                                    const valNodeId = `VAL_${cat.id}_${field}_${index}`;
                                    nodes.push({ id: valNodeId, label: `${field}:\n${val}`, shape: 'box', color: '#f3f4f6', font: { size: 12 } });
                                    edges.push({ from: catNodeId, to: valNodeId, color: '#d1d5db' });
                                }
                            });
                        }
                    });
                });

                if (nodes.length === 1) {
                    nodes.push({ id: 'EMPTY', label: 'ยังไม่มีข้อมูลความเชื่อมโยง', shape: 'text', font: { color: '#9ca3af' }});
                    edges.push({ from: 'TARGET', to: 'EMPTY', dashes: true });
                }

                const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
                const options = {
                    physics: { barnesHut: { gravitationalConstant: -3000, centralGravity: 0.3, springLength: 100 } },
                    layout: { improvedLayout: true }
                };

                new vis.Network(container, data, options);
            };

            React.useEffect(() => {
                if (activeTab === 'mindmap') {
                    setTimeout(() => drawGraph(), 100);
                }
            }, [activeTab, checklistData, targetInfo]);

            const exportPDF = (elementId, filename) => {
                const element = document.getElementById(elementId);
                const opt = {
                    margin: 0.5,
                    filename: `${filename}_${targetInfo.caseNo || 'draft'}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
                };
                
                showModal('กำลังประมวลผล', 'กำลังสร้างไฟล์ PDF กรุณารอสักครู่...');
                
                setTimeout(() => {
                    html2pdf().set(opt).from(element).save().then(() => {
                        closeModal();
                    });
                }, 800);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-blue-900 text-white shadow-md">
                        <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
                            <div className="flex items-center">
                                <div className="h-12 w-12 rounded-full bg-white flex items-center justify-center mr-4 border-2 border-yellow-400">
                                    <i className="fas fa-shield-alt text-blue-900 text-2xl"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold">ระบบบริหารงานสืบสวนคดีอาญา</h1>
                                    <p className="text-sm text-blue-200">กองกำกับการ 1 กองบังคับการปฏิบัติการพิเศษ (กก.1 บก.ปพ.)</p>
                                </div>
                            </div>
                            <div className="text-right">
                                {isReadOnly && <span className="bg-red-500 text-white px-3 py-1 rounded-full text-xs font-bold mr-2"><i className="fas fa-lock"></i> โหมดอ่านอย่างเดียว</span>}
                                <span className="text-sm font-medium"><i className="fas fa-user-circle"></i> เจ้าหน้าที่ส่วนกลาง</span>
                            </div>
                        </div>
                    </header>

                    <div className="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <nav className="-mb-px flex space-x-8">
                                <button onClick={() => setActiveTab('checklist')} className={`whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors duration-200 ${activeTab === 'checklist' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>
                                    <i className="fas fa-tasks mr-2"></i> Checklist
                                </button>
                                <button onClick={() => setActiveTab('mindmap')} className={`whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors duration-200 ${activeTab === 'mindmap' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>
                                    <i className="fas fa-project-diagram mr-2"></i> แผนผังความเชื่อมโยง (Mind Map)
                                </button>
                                <button onClick={() => setActiveTab('dashboard')} className={`whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors duration-200 ${activeTab === 'dashboard' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>
                                    <i className="fas fa-chart-pie mr-2"></i> สรุปข้อมูล (Dashboard)
                                </button>
                                <button onClick={() => setActiveTab('history')} className={`whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors duration-200 ${activeTab === 'history' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>
                                    <i className="fas fa-history mr-2"></i> ประวัติ Checklist
                                </button>
                            </nav>
                        </div>
                    </div>

                    <main className="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab !== 'history' && (
                            <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6">
                                <h2 className="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">ข้อมูลพื้นฐานเป้าหมาย</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">เลขคดี / หมายจับ</label>
                                        <input type="text" name="caseNo" value={targetInfo.caseNo} onChange={handleTargetInfoChange} disabled={isReadOnly} className="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100" placeholder="ระบุเลขคดี..." />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">ชื่อ-สกุล เป้าหมาย</label>
                                        <input type="text" name="targetName" value={targetInfo.targetName} onChange={handleTargetInfoChange} disabled={isReadOnly} className="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100" placeholder="ระบุชื่อเป้าหมาย..." />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">ผู้รับผิดชอบหมายจับ</label>
                                        <input type="text" name="officerName" value={targetInfo.officerName || ''} onChange={handleTargetInfoChange} disabled={isReadOnly} className="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100" placeholder="ยศ ชื่อ นามสกุล" />
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'checklist' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-blue-50 p-4 rounded-lg border border-blue-100">
                                    <p className="text-sm text-blue-800"><i className="fas fa-info-circle mr-2"></i> กรอกข้อมูลที่สืบสวนได้ลงในแบบฟอร์มด้านล่าง คุณสามารถเพิ่มรายการในแต่ละหัวข้อได้หากมีข้อมูลมากกว่า 1 รายการ</p>
                                    {!isReadOnly && (
                                        <button onClick={() => {
                                            const newCatName = prompt("กรุณาระบุชื่อหมวดหมู่ใหม่:");
                                            if (newCatName) setCategories([...categories, { id: Date.now(), name: newCatName, fields: [] }]);
                                        }} className="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 transition text-sm">
                                            <i className="fas fa-plus"></i> เพิ่มหมวดหมู่ใหม่
                                        </button>
                                    )}
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {categories.map((category) => (
                                        <div key={category.id} className="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex flex-col h-full">
                                            <div className="bg-gray-50 px-4 py-3 border-b border-gray-200 font-semibold text-gray-800">
                                                {category.name}
                                            </div>
                                            <div className="p-4 space-y-4 flex-1">
                                                {category.fields.map((field, fieldIdx) => {
                                                    const fieldId = `${category.id}_${field}`;
                                                    const values = checklistData[fieldId] || [''];
                                                    
                                                    return (
                                                        <div key={fieldIdx} className="border-b border-gray-100 pb-3 last:border-0">
                                                            <div className="flex justify-between items-center mb-1">
                                                                <label className="block text-xs font-medium text-gray-600">{field}</label>
                                                                {!isReadOnly && (
                                                                    <button onClick={() => addFieldItem(fieldId)} className="text-xs text-blue-600 hover:text-blue-800"><i className="fas fa-plus"></i> เพิ่ม</button>
                                                                )}
                                                            </div>
                                                            {values.map((val, valIdx) => (
                                                                <div key={valIdx} className="flex mb-2">
                                                                    <input type="text" value={val} disabled={isReadOnly} onChange={(e) => handleChecklistChange(fieldId, valIdx, e.target.value)} className="flex-1 text-sm border-gray-300 rounded shadow-sm p-1.5 border focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100" placeholder="ระบุข้อมูล..." />
                                                                    {values.length > 1 && !isReadOnly && (
                                                                        <button onClick={() => removeFieldItem(fieldId, valIdx)} className="ml-2 text-red-500 hover:text-red-700 px-1"><i className="fas fa-minus-circle"></i></button>
                                                                    )}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    );
                                                })}
                                                
                                                {!isReadOnly && (
                                                    <button onClick={() => addNewCustomField(category.id)} className="w-full mt-2 py-2 border-2 border-dashed border-green-300 text-green-600 rounded-md text-sm font-medium hover:bg-green-50 transition-colors">
                                                        <i className="fas fa-plus mr-1"></i> เพิ่มหัวข้ออื่น (ผู้ใช้ระบุเอง)
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                {!isReadOnly && (
                                    <div className="mt-8 bg-white p-6 rounded-lg shadow-sm border border-gray-200 text-center">
                                        <button onClick={handleSaveOnline} className="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition-transform transform hover:scale-105">
                                            <i className="fas fa-save mr-2"></i> บันทึกข้อมูลเข้าสู่ระบบออนไลน์
                                        </button>
                                        <p className="text-xs text-gray-500 mt-2">เมื่อบันทึกแล้ว เจ้าหน้าที่ท่านอื่นในระบบจะสามารถมองเห็นข้อมูลนี้ได้</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'mindmap' && (
                            <div className="bg-white rounded-lg shadow p-4">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold">แผนผังความเชื่อมโยงเป้าหมาย (Mind Map)</h3>
                                    <button onClick={() => exportPDF('pdf-mindmap-container', 'MindMap')} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-sm shadow">
                                        <i className="fas fa-file-pdf mr-2"></i> ส่งออก PDF
                                    </button>
                                </div>
                                <div id="pdf-mindmap-container" className="p-4 bg-white">
                                    <div className="text-center mb-4 hidden print-header">
                                        <h2 className="text-2xl font-bold">แผนผังความเชื่อมโยงเป้าหมาย</h2>
                                        <p className="text-lg">หมายจับ/คดี: {targetInfo.caseNo} | ผู้ต้องหา: {targetInfo.targetName}</p>
                                        <p className="text-sm">ผู้รับผิดชอบ: {targetInfo.officerName || '-'}</p>
                                        <hr className="my-2" />
                                    </div>
                                    <div id="network-canvas"></div>
                                    <p className="text-sm text-gray-500 mt-2 text-center">* สามารถใช้เมาส์ซูมเข้า-ออก หรือลากโหนดเพื่อจัดระเบียบแผนผังได้</p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'dashboard' && (
                            <div className="bg-white rounded-lg shadow p-4">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold">สรุปความคืบหน้าการรวบรวมข้อมูล</h3>
                                    <button onClick={() => exportPDF('pdf-dashboard-container', 'Dashboard')} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-sm shadow">
                                        <i className="fas fa-file-pdf mr-2"></i> ส่งออก PDF
                                    </button>
                                </div>
                                <div id="pdf-dashboard-container" className="p-4 bg-white">
                                    <div className="text-center mb-6 border-b pb-4">
                                        <h2 className="text-2xl font-bold">รายงานสรุปข้อมูลเป้าหมาย</h2>
                                        <div className="flex justify-center space-x-8 mt-2 text-gray-700">
                                            <p><strong>หมายจับ/คดี:</strong> {targetInfo.caseNo || '-'}</p>
                                            <p><strong>ผู้ต้องหา:</strong> {targetInfo.targetName || '-'}</p>
                                            <p><strong>ผู้รับผิดชอบ:</strong> {targetInfo.officerName || '-'}</p>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {categories.map((cat) => {
                                            const totalFields = cat.fields.length;
                                            const filledFields = cat.fields.filter(field => {
                                                const vals = checklistData[`${cat.id}_${field}`];
                                                return vals && vals.some(v => v && String(v).trim() !== '');
                                            }).length;
                                            const progress = totalFields === 0 ? 0 : Math.round((filledFields / totalFields) * 100);
                                            
                                            return (
                                                <div key={cat.id} className="border border-gray-200 rounded p-4 bg-gray-50">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <span className="font-semibold text-gray-700 text-sm">{cat.name}</span>
                                                        <span className={`text-xs font-bold px-2 py-1 rounded-full ${progress === 100 ? 'bg-green-100 text-green-800' : progress > 0 ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'}`}>
                                                            {progress}%
                                                        </span>
                                                    </div>
                                                    <div className="w-full bg-gray-200 rounded-full h-2 mb-2">
                                                        <div className={`h-2 rounded-full ${progress === 100 ? 'bg-green-500' : progress > 0 ? 'bg-yellow-400' : 'bg-red-500'}`} style={{ width: `${progress}%` }}></div>
                                                    </div>
                                                    <p className="text-xs text-gray-500 text-right">{filledFields} / {totalFields} รายการ</p>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'history' && (
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                                <div className="p-6 border-b border-gray-200 bg-gray-50 flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div>
                                        <h3 className="text-lg font-bold text-gray-800">ฐานข้อมูลประวัติ Checklist (ส่วนกลาง)</h3>
                                        <p className="text-sm text-gray-500">ข้อมูลทั้งหมดที่ถูกบันทึกขึ้นระบบออนไลน์ เจ้าหน้าที่สามารถร่วมกันตรวจสอบได้</p>
                                    </div>
                                    <div className="relative w-full md:w-64">
                                        <input type="text" placeholder="ค้นหาชื่อ, เลขคดี..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-blue-500 focus:border-blue-500 text-sm" />
                                        <i className="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                                    </div>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="min-w-full divide-y divide-gray-200">
                                        <thead className="bg-gray-100">
                                            <tr>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">วันเวลาที่บันทึก</th>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">เลขคดี / หมายจับ</th>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ชื่อเป้าหมาย</th>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ผู้รับผิดชอบ</th>
                                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">สถานะ</th>
                                                <th className="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">การจัดการ</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-white divide-y divide-gray-200">
                                            {allCasesHistory.length === 0 ? (
                                                <tr><td colSpan="6" className="px-6 py-8 text-center text-gray-500">กำลังโหลดข้อมูล หรือยังไม่มีข้อมูลในระบบออนไลน์</td></tr>
                                            ) : (
                                                allCasesHistory.filter(item => {
                                                    const term = searchTerm.toLowerCase();
                                                    return (item.targetInfo?.targetName?.toLowerCase().includes(term) || 
                                                            item.targetInfo?.caseNo?.toLowerCase().includes(term) ||
                                                            item.targetInfo?.officerName?.toLowerCase().includes(term));
                                                }).map((item, idx) => (
                                                    <tr key={item.id || idx} className="hover:bg-gray-50 transition-colors">
                                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                            {new Date(item.updatedAt).toLocaleString('th-TH')}
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap">
                                                            <div className="text-sm font-medium text-gray-900">{item.targetInfo?.caseNo || '-'}</div>
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap">
                                                            <div className="text-sm font-bold text-blue-600">{item.targetInfo?.targetName || 'ไม่ระบุชื่อ'}</div>
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                            {item.targetInfo?.officerName || '-'}
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap">
                                                            <span className="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                                                ออนไลน์
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                            <button onClick={() => loadCaseForDashboard(item)} className="text-purple-600 hover:text-purple-900 mx-2" title="ดูสรุปข้อมูล (Dashboard)">
                                                                <i className="fas fa-chart-pie text-lg"></i>
                                                            </button>
                                                            <button onClick={() => loadCaseForMindMap(item)} className="text-blue-600 hover:text-blue-900 mx-2" title="ดูแผนผัง (Mind Map)">
                                                                <i className="fas fa-project-diagram text-lg"></i>
                                                            </button>
                                                            <button onClick={() => loadCaseForEdit(item)} className="text-yellow-500 hover:text-yellow-700 mx-2" title="นำมาแก้ไข">
                                                                <i className="fas fa-edit text-lg"></i>
                                                            </button>
                                                            <button onClick={() => requestDeleteCase(item.id, item.targetInfo?.targetName)} className="text-red-500 hover:text-red-700 mx-2" title="ลบข้อมูล">
                                                                <i className="fas fa-trash-alt text-lg"></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {modalInfo.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg shadow-xl p-6 max-w-sm w-full animate-fade-in-up">
                                <h3 className="text-lg font-bold text-gray-900 mb-2">{modalInfo.title}</h3>
                                <p className="text-gray-600 mb-6 text-sm">{modalInfo.message}</p>
                                <button onClick={closeModal} className="w-full bg-blue-600 text-white rounded-lg py-2 font-medium hover:bg-blue-700 transition">ตกลง</button>
                            </div>
                        </div>
                    )}

                    {confirmModal.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg shadow-xl p-6 max-w-md w-full border-t-4 border-red-500">
                                <div className="flex items-center mb-4">
                                    <div className="bg-red-100 p-2 rounded-full mr-3">
                                        <i className="fas fa-exclamation-triangle text-red-600 text-xl"></i>
                                    </div>
                                    <h3 className="text-xl font-bold text-gray-900">{confirmModal.title}</h3>
                                </div>
                                <p className="text-gray-600 mb-6 whitespace-pre-line text-sm">{confirmModal.message}</p>
                                <div className="flex justify-end space-x-3">
                                    <button onClick={closeConfirm} className="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 font-medium transition">ยกเลิก</button>
                                    <button onClick={confirmModal.onConfirm} className="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 font-medium shadow-sm transition">ยืนยันการลบ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <style>{`
                        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
                        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out; }
                        @media print { .print-header { display: block !important; } }
                    `}</style>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
